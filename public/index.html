<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filelist + TorBox Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; }
        .input-field { 
            background: #1e293b; border: 1px solid #334155; color: #f8fafc; 
            transition: border-color 0.2s;
        }
        .input-field:focus { border-color: #3b82f6; outline: none; }
    </style>
</head>
<body class="text-gray-200 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl overflow-hidden border border-slate-700">
        <div class="p-6 sm:p-8">
            <h1 class="text-2xl font-bold text-white mb-2">Filelist <span class="text-blue-500">+</span> TorBox</h1>
            <p class="text-slate-400 text-sm mb-6">Configure your Filelist API credentials and TorBox key to generate your personal addon link.</p>

            <form id="configForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Filelist Username</label>
                    <input type="text" id="fl_username" required placeholder="Your Filelist account username" class="input-field w-full px-4 py-2 rounded-lg text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Filelist Passkey</label>
                    <input type="password" id="fl_passkey" required placeholder="32-character passkey" class="input-field w-full px-4 py-2 rounded-lg text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">TorBox API Key</label>
                    <input type="password" id="torbox_key" required placeholder="tb-..." class="input-field w-full px-4 py-2 rounded-lg text-sm">
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
                        Generate Install Link
                    </button>
                </div>
            </form>

            <div id="installSection" class="hidden mt-6 pt-6 border-t border-slate-700">
                <a id="installBtn" href="#" class="block w-full bg-green-600 hover:bg-green-500 text-white text-center font-bold py-3 px-4 rounded-lg shadow-lg transition duration-200 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Install to Stremio / Nuvio
                </a>
                <p class="text-xs text-slate-500 text-center mt-3">Link securely embeds your credentials. Do not share it.</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('configForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const config = {
                fl_username: document.getElementById('fl_username').value.trim(),
                fl_passkey: document.getElementById('fl_passkey').value.trim(),
                torbox_key: document.getElementById('torbox_key').value.trim()
            };

            const configString = encodeURIComponent(JSON.stringify(config));
            const host = window.location.host;
            const installUrl = `stremio://${host}/${configString}/manifest.json`;

            const installBtn = document.getElementById('installBtn');
            installBtn.href = installUrl;
            
            document.getElementById('installSection').classList.remove('hidden');
        });
    </script>
</body>
</html>
